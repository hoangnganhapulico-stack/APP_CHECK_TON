name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          # Tìm file html bất kỳ và chép làm index.html
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          else
            echo "Khong tim thấy file HTML!" && exit 1
          fi

      - name: Install Capacitor & Build
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Kohnan Ton Kho" "com.kohnan.tonkho" --web-dir www
          npx cap add android
          npx cap copy

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KohnanTonKho-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
